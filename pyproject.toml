[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-service"
version = "1.0.0"
description = "Secure multi-user notes REST service (Bluestaq take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Andrew Hale" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # HTML sanitisation for rich-text note content (domain invariant).
    "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]

[project.scripts]
notes-service = "notes_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
]
ignore = ["B008"] # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["notes_service"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["notes_service"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "jwt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgresql: integration tests that require a running PostgreSQL server",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:notes_service.*"]

# nginx configuration for the Bluestaq Notes web client.
#
# Serves the built SPA and reverse-proxies the API so the browser uses a single
# origin. Because the API is same-origin, no CORS configuration is required on
# the backend for this deployment path.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable security headers for a static+proxy host. The API adds its own
    # headers on proxied responses; these cover the SPA documents.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compress text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Forward API calls to the backend service. "api" is the compose service
    # name, resolved by Docker's embedded DNS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the client's correlation id if present.
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # Health/readiness probes are also proxied so the whole stack can be checked
    # from a single origin.
    location = /health {
        proxy_pass http://api:8000/health;
    }
    location = /readiness {
        proxy_pass http://api:8000/readiness;
    }

    # Long-lived caching for hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

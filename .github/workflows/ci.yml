name: CI

# The repository had no CI at all (risk R3): every gate in AGENTS.md ran only
# when a human or agent invoked it by hand. This workflow makes those gates a
# durable regression barrier on every push and pull request.

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (ruff format)
        run: ruff format --check

      - name: Lint (ruff check)
        run: ruff check

      - name: Type check (mypy --strict)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

      - name: Migrations apply and revert on a fresh database
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: sqlite:///./ci-migrations.db
          ENVIRONMENT: development
        run: |
          alembic upgrade head
          alembic downgrade base

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
